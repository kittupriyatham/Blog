# Render Blueprint (https://render.com/docs/blueprint-spec)
#
# Since your GitHub repository is PUBLIC, this file intentionally defines
# clean configuration keys with safe placeholders (or sync: false) so no
# real passwords, API tokens, or database connection strings are exposed in Git.
#
# How deployment works:
# 1. Connect this repo to Render as a "Blueprint".
# 2. Render reads this file and creates the web service with all required keys.
# 3. In the Render Dashboard, paste your real credentials for each variable.
#
services:
  - type: web
    name: blog
    runtime: python
    plan: free            # Render Free/Hobby tier (512MB RAM, spins down on idle)
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 180 --bind 0.0.0.0:$PORT
    envVars:
      # --- Core App Settings ---
      - key: SECRET_KEY
        sync: false
      - key: FLASK_DEBUG
        value: "0"
      - key: BLOG_ADMIN_USERNAME
        value: admin
      - key: BLOG_ADMIN_PASSWORD
        sync: false
      - key: SITE_URL
        value: https://blog.potluri-krishna-priyatham.tech
      - key: SITE_URL_ALT
        value: https://blog.kittupriyatham.com

      # --- Database (MongoDB Atlas) ---
      - key: DB_BACKEND
        value: cloud
      - key: DEFAULT_BACKEND
        value: local
      - key: ATLAS_MONGO_URI
        sync: false
      - key: ATLAS_MONGO_NAME
        value: kittupriyatham
      - key: ATLAS_MONGO_PASS
        sync: false
      - key: ANALYTICS_STORE
        value: mongo
      - key: ANALYTICS_IP_SALT
        value: blog-analytics
      - key: ANALYTICS_GEO
        value: "1"

      # --- Media Storage (Cloudflare R2) ---
      - key: MEDIA_BACKEND
        value: cloud
      - key: MEDIA_ADAPTER
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: blog-data
      - key: R2_PUBLIC_BASE
        value: https://pub-5dd94088ada04ea8b72ad971f9943617.r2.dev
      - key: R2_S3_ENDPOINT
        value: https://8c80a0cbc1645657715aa1218c967dea.r2.cloudflarestorage.com
      - key: CLOUDFLARE_API_TOKEN
        sync: false

      # --- LinkedIn Direct Integration ---
      - key: LINKEDIN_ACCESS_TOKEN
        sync: false
      - key: LINKEDIN_AUTHOR_URN
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_REDIRECT_URI
        value: https://www.linkedin.com/developers/tools/oauth/redirect
      - key: LINKEDIN_ORGANIZATION_URN
        value: "0"

      # --- Dev.to & Hashnode POSSE Syndication ---
      - key: DEVTO_API_KEY
        sync: false
      - key: HASHNODE_ACCESS_TOKEN
        sync: false
      - key: HASHNODE_PUBLICATION_ID
        value: 6ad1e1aa1cddb0d5092b0796

      # --- SocialAPI, YouTube & AI Rewriter ---
      - key: SOCIALAPI_KEY
        sync: false
      - key: SOCIALAPI_BOARD_PINTEREST
        value: "1114359570239165244"
      - key: GEMINI_API_KEY
        sync: false
      - key: REWRITE_MODEL
        value: gemini-3.5-flash-lite
      - key: YOUTUBE_CATEGORY
        value: "22"
      - key: YOUTUBE_VISIBILITY
        value: public

      # --- Platform Flags & Medium ---
      - key: MEDIUM_HEADLESS
        value: "1"
      - key: MEDIUM_CHANNEL
        value: chrome
      - key: TWITTER_API_CREDIT
        value: "0"
      - key: TWITTER_SUBSCRIPTION
        value: "0"

      # --- Telegram Alerts (Optional) ---
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

      # --- Upload & Moderation ---
      - key: UPLOAD_TOKEN
        sync: false

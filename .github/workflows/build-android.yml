name: Build Android APK

on:
  push:
    branches: [ main, feature/mobile-api ]
    paths:
      - 'core/android/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    paths:
      - 'core/android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Grant execute permission for gradlew
        run: chmod +x core/android/gradlew

      - name: Build Release APK
        working-directory: core/android
        run: ./gradlew assembleRelease --stacktrace -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}

      - name: Prepare APK Release Files
        run: |
          APK_PATH=$(find core/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found generated APK: $APK_PATH"
          VERSION="v1.0.${{ github.run_number }}"
          cp "$APK_PATH" "Potluri-Blog-${VERSION}.apk"
          cp "$APK_PATH" "Blog-${VERSION}.apk"
          cp "$APK_PATH" "Potluri-Blog.apk"
          cp "$APK_PATH" "Blog.apk"
          ls -lh *.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blog-v1.0.${{ github.run_number }}
          path: Blog-v1.0.${{ github.run_number }}.apk

      - name: Publish Versioned GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Blog v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: |
            Blog-v1.0.${{ github.run_number }}.apk
            Blog.apk
            Potluri-Blog-v1.0.${{ github.run_number }}.apk
            Potluri-Blog.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune Old Assets from Latest Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          gh release view latest --json assets --jq '.assets[].name' | while read -r name; do
            if [ -n "$name" ]; then
              echo "Pruning existing asset from latest: $name"
              gh release delete-asset latest "$name" -y || true
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or Update Latest Release Tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Blog (Latest)
          make_latest: true
          body: |
            ### 📱 Blog Android App (Latest)

            Native Android application for **Blog** ([blog.potluri-krishna-priyatham.tech](https://blog.potluri-krishna-priyatham.tech)).

            #### ✨ Features:
            - **Native Android UI**: Built with Jetpack Compose & Material 3.
            - **Official Branded App Icon**: Custom high-density launcher icons & adaptive vector design.
            - **Offline-First & Fast Caching**: Smooth browsing and reading experience.
            - **Deep Linking**: Direct handling of article and post URLs.

            #### 📦 Download:
            - **[Blog-v1.0.${{ github.run_number }}.apk](https://github.com/${{ github.repository }}/releases/download/latest/Blog-v1.0.${{ github.run_number }}.apk)** (Versioned)
            - **[Blog.apk](https://github.com/${{ github.repository }}/releases/download/latest/Blog.apk)** (Latest alias)
          files: |
            Blog-v1.0.${{ github.run_number }}.apk
            Blog.apk
            Potluri-Blog-v1.0.${{ github.run_number }}.apk
            Potluri-Blog.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Android APK

on:
  push:
    branches: [ main, feature/mobile-api ]
    paths:
      - 'code/android/**'
  pull_request:
    paths:
      - 'code/android/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Grant execute permission for gradlew
        run: chmod +x code/android/gradlew

      - name: Build Debug APK
        working-directory: code/android
        run: ./gradlew assembleDebug --stacktrace -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.run_number }}
          path: code/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Android v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: code/android/app/build/outputs/apk/debug/app-debug.apk

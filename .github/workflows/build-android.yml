name: Build Android APK

on:
  push:
    branches: [ main, feature/mobile-api ]
    tags:
      - 'android-v*'
    paths:
      - 'src/android/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    paths:
      - 'src/android/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Grant execute permission for gradlew
        run: chmod +x src/android/gradlew

      - name: Build Debug APK
        working-directory: src/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: src/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Android ${{ github.ref_name }}
          generate_release_notes: true
          files: src/android/app/build/outputs/apk/debug/app-debug.apk

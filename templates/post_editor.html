<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if post %}Edit Post{% else %}New Post{% endif %} - Blog</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✍️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
          colors: { brand: { 50:'#eef2ff',100:'#e0e7ff',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca' } },
          boxShadow: { soft: '0 2px 10px -2px rgb(0 0 0 / 0.06), 0 12px 32px -12px rgb(0 0 0 / 0.12)' },
        },
      },
    };
  </script>
  <style>body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; } textarea { resize: none; overflow: hidden; }</style>
</head>
<body class="bg-white dark:bg-slate-950 min-h-screen text-slate-800 dark:text-slate-200 antialiased">

  <input type="hidden" id="post-id" value="{{ post.post_id if post else '' }}">
  <input type="hidden" id="csrf-token" value="{{ csrf_token() }}">

  <nav class="sticky top-0 z-30 bg-white/80 dark:bg-slate-950/80 backdrop-blur-lg border-b border-slate-200/70 dark:border-slate-800/70">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <a href="{{ url_for('posts_dashboard') }}" class="text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white transition rounded-full p-2 hover:bg-slate-100 dark:hover:bg-slate-800" aria-label="Back to posts" title="Back to Posts">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
          </svg>
        </a>
        <div class="flex flex-col">
          <span class="font-bold text-slate-800 dark:text-white tracking-tight">{% if post %}Editing Post{% else %}New Post{% endif %}</span>
          <span id="save-status" class="text-xs font-medium text-gray-400">Nothing saved yet</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button type="button" data-theme-toggle onclick="toggleTheme()" class="p-2 rounded-full text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="Toggle theme" aria-label="Toggle theme">
          <svg data-icon-moon class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
          <svg data-icon-sun class="w-5 h-5 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path stroke-linecap="round" d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        </button>
        <button type="button" id="save-draft-btn" class="text-slate-600 dark:text-slate-300 hover:text-brand-600 dark:hover:text-brand-400 bg-slate-50 dark:bg-slate-800 hover:bg-brand-50 dark:hover:bg-slate-700 font-medium px-4 py-1.5 rounded-full text-sm transition">
          Save draft
        </button>
        <button type="button" id="publish-btn" class="bg-gradient-to-r from-brand-600 to-blue-600 hover:from-brand-700 hover:to-blue-700 text-white font-medium px-6 py-1.5 rounded-full text-sm transition shadow-sm hover:shadow-md">
          Publish
        </button>
      </div>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto px-4 py-8">
    <textarea id="post-content" name="content" rows="6" placeholder="What do you want to share?"
      class="w-full text-xl leading-relaxed text-slate-800 dark:text-slate-100 placeholder-slate-300 dark:placeholder-slate-600 focus:outline-none bg-transparent min-h-[160px] block">{{ content }}</textarea>

    <input type="text" id="post-tags" placeholder="Tags (comma separated)" value="{{ (post.tags | join(', ')) if post and post.tags else '' }}"
      class="mt-3 w-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500 transition">

    <div id="existing-media" class="hidden mt-4 flex flex-wrap gap-3"></div>
    <div id="new-media-preview" class="hidden mt-4 flex flex-wrap gap-3"></div>

    <div class="mt-6 flex items-center gap-4 border-t border-slate-100 dark:border-slate-800 pt-4">
      {% include '_attach_menu.html' %}
      <div class="w-px h-4 bg-slate-200 dark:bg-slate-700"></div>
      <span class="text-xs text-slate-400 dark:text-slate-500">Attach media, or mention an existing article in your post.</span>
    </div>

    <div class="mt-4">
      {% include '_syndication_options.html' %}
    </div>
  </main>

  <script src="{{ url_for('static', filename='js/attach.js') }}"></script>
  <script>
    (function () {
      var postContent = document.getElementById('post-content');
      var existingMedia = {{ media_paths | tojson }};
      var newFileInput = document.getElementById('attach-file-input');
      var saveStatus = document.getElementById('save-status');

      // What the syndication guard treats as real media: newly attached files
      // plus media already saved on this post. Attached articles, attached
      // posts and code blocks never count.
      window.collectSyndicationMedia = function () {
        var out = [];
        Array.prototype.slice.call(newFileInput.files || []).forEach(function (f) { out.push({ type: f.type }); });
        (existingMedia || []).forEach(function (p) { out.push({ path: p }); });
        return out;
      };

      function autoResize() {
        postContent.style.height = 'auto';
        postContent.style.height = postContent.scrollHeight + 'px';
      }
      postContent.addEventListener('input', autoResize);
      autoResize();

      function renderExisting() {
        var box = document.getElementById('existing-media');
        box.innerHTML = '';
        if (!existingMedia.length) { box.classList.add('hidden'); return; }
        box.classList.remove('hidden');
        existingMedia.forEach(function (p, idx) {
          var el = document.createElement('div');
          el.className = 'relative';
          var ext = p.split('.').pop().toLowerCase();
          if (['png', 'jpg', 'jpeg', 'gif', 'webp'].indexOf(ext) !== -1) {
            el.innerHTML = '<img src="' + p + '" class="w-24 h-24 object-cover rounded-xl border border-slate-200 dark:border-slate-700" alt="media">';
          } else {
            el.innerHTML = '<div class="w-44 px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs text-slate-600 dark:text-slate-300 truncate">' + p.split('/').pop() + '</div>';
          }
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = '\u00d7';
          btn.className = 'absolute -top-2 -right-2 w-6 h-6 rounded-full bg-red-500 text-white text-sm leading-none';
          btn.onclick = function () { existingMedia.splice(idx, 1); renderExisting(); };
          el.appendChild(btn);
          box.appendChild(el);
        });
      }
      renderExisting();

      newFileInput.addEventListener('change', function () {
        var box = document.getElementById('new-media-preview');
        var files = Array.prototype.slice.call(newFileInput.files || []);
        box.innerHTML = '';
        if (!files.length) { box.classList.add('hidden'); return; }
        box.classList.remove('hidden');
        files.forEach(function (f) {
          if (f.type.indexOf('image/') === 0) {
            var img = document.createElement('img');
            img.src = URL.createObjectURL(f);
            img.className = 'w-24 h-24 object-cover rounded-xl border border-slate-200 dark:border-slate-700';
            box.appendChild(img);
          } else {
            var chip = document.createElement('span');
            chip.textContent = f.name;
            chip.className = 'px-3 py-2 rounded-xl text-xs bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 max-w-[12rem] truncate';
            box.appendChild(chip);
          }
        });
      });

      var saving = false;
      async function save(action) {
        if (saving) return;
        var content = postContent.value.trim();
        if (action === 'publish' && !content) { alert('Content is required to publish.'); return; }
        if (action === 'publish') {
          // Instagram / Pinterest need an image or video, YouTube needs a video.
          var mediaBlock = window.syndicationBlockReason ? window.syndicationBlockReason() : null;
          if (mediaBlock) { alert('Cannot publish: ' + mediaBlock); return; }
        }
        saving = true;
        var fd = new FormData();
        fd.append('content', content);
        fd.append('action', action);
        fd.append('post_id', document.getElementById('post-id').value);
        fd.append('keep_media', JSON.stringify(existingMedia));
        fd.append('csrf_token', document.getElementById('csrf-token').value);
        fd.append('tags', document.getElementById('post-tags').value);
        document.querySelectorAll('input[name="platforms"]:checked').forEach(function (cb) { fd.append('platforms', cb.value); });
        var files = Array.prototype.slice.call(newFileInput.files || []);
        fd.append('new_files', String(files.length));
        files.forEach(function (f, i) { fd.append('file_' + i, f); });
        try {
          var resp = await fetch('{{ url_for("api_save_post") }}', { method: 'POST', body: fd });
          var data = await resp.json();
          if (data.status === 'success') {
            if (data.skipped && data.skipped.length) {
              alert('These files were skipped (unsupported file type):\n' + data.skipped.join('\n'));
            }
            window.location.href = '{{ url_for("posts_dashboard") }}';
          } else {
            saving = false;
            alert('Error: ' + (data.message || 'could not save'));
          }
        } catch (e) {
          saving = false;
          console.error(e);
          alert('Save failed. Please try again.');
        }
      }

      document.getElementById('save-draft-btn').addEventListener('click', function () {
        saveStatus.textContent = 'Saving...';
        save('draft');
      });
      document.getElementById('publish-btn').addEventListener('click', function () { save('publish'); });

      initAttachMenu();
    })();
  </script>
</body>
</html>

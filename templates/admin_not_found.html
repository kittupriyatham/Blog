<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>404 Not Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-[#0b0f17] text-slate-300 min-h-screen flex items-center justify-center p-4 antialiased selection:bg-slate-800 selection:text-white">

  <div class="w-full max-w-lg bg-[#0e1420]/90 border border-slate-800/80 rounded-2xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
    
    <!-- Terminal Header Bar -->
    <div class="flex items-center justify-between pb-4 mb-6 border-b border-slate-800/80">
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-red-500/80"></span>
        <span class="w-3 h-3 rounded-full bg-yellow-500/80"></span>
        <span class="w-3 h-3 rounded-full bg-green-500/80"></span>
      </div>
      <span class="text-xs text-slate-500 uppercase tracking-widest font-semibold">HTTP / 1.1</span>
    </div>

    <!-- Error Content -->
    <div class="space-y-4">
      <div class="flex items-center gap-3">
        <span class="px-2.5 py-1 rounded bg-red-950/60 text-red-400 border border-red-900/40 text-xs font-bold">
          404
        </span>
        <h1 class="text-lg font-bold text-slate-100 tracking-tight">
          Not Found
        </h1>
      </div>

      <p class="text-xs sm:text-sm text-slate-400 leading-relaxed font-normal">
        The requested URL was not found on this server. If you entered the URL manually, please check your spelling and try again.
      </p>

      <!-- System Diagnostic Block -->
      <div class="mt-4 p-3.5 rounded-xl bg-black/40 border border-slate-800/60 font-mono text-xs text-slate-500 space-y-1">
        <div class="flex justify-between">
          <span>server:</span>
          <span class="text-slate-400">gunicorn-edge</span>
        </div>
        <div class="flex justify-between">
          <span>status:</span>
          <span class="text-red-400">404 NOT_FOUND</span>
        </div>
        <div class="flex justify-between">
          <span>connection:</span>
          <span class="text-slate-400">closed</span>
        </div>
      </div>
    </div>

    <!-- Return Action -->
    <div class="mt-6 pt-4 border-t border-slate-800/60 flex items-center justify-between text-xs">
      <a href="/" class="text-slate-400 hover:text-white transition flex items-center gap-1.5 underline underline-offset-4 decoration-slate-700 hover:decoration-slate-400">
        &larr; Return to index
      </a>
      <span class="text-slate-600">&copy; Web Gateway</span>
    </div>

  </div>

</body>
</html>
